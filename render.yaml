services:
  - type: web
    name: ancla-backend
    runtime: python
    rootDir: backend
    plan: free
    branch: develop
    buildCommand: pip install .
    startCommand: python -m app.serve
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEMO_MODE
        value: "false"
      - key: BACKEND_API_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: hackmty_capitalone
      - key: NESSIE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
